[program:backend]
directory=/app

command=/root/.venv/bin/uvicorn backend.server:app --app-dir /app --host 0.0.0.0 --port 8001 --workers 1

autostart=true
autorestart=true

stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log

environment=PYTHONPATH="/app",MPESA_ENV="sandbox",MPESA_CONSUMER_KEY="test_key",MPESA_CONSUMER_SECRET="test_secret",MPESA_SHORTCODE="174379",MPESA_PASSKEY="test_passkey",MPESA_CALLBACK_URL="http://127.0.0.1:8001/mpesa/callback"
